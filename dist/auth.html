<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Truve Google 계정 로그인" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Truve | 로그인</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" crossorigin src="/assets/auth--uXURwUC.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-eJgYjmQ8.js">
    <link rel="modulepreload" crossorigin href="/assets/nav-2t9yL-0h.js">
    <link rel="stylesheet" crossorigin href="/assets/styles-SZnvY7n5.css">
  </head>
  <body>
    <main class="app-shell auth-page auth-login-page">
      <div id="top-nav"></div>

      <section class="login-page-title">
        <h1>로그인</h1>
      </section>

      <section class="login-panel" aria-labelledby="login-panel-title">
        <article class="login-panel-left">
          <div>
            <p class="summary-kicker">Google Sign In</p>
            <h2 id="login-panel-title">Google 계정으로 로그인</h2>
            <p>내 기부 현황, Evidence, XLS-70 Credential 상태를 한 계정으로 이어서 확인합니다.</p>
          </div>

          <label class="auth-consent">
            <input id="auth-terms-agree" type="checkbox" />
            <span>
              <a href="./terms.html" target="_blank" rel="noreferrer">서비스 이용약관</a>과
              <a href="./privacy.html" target="_blank" rel="noreferrer">개인정보처리방침</a>을 확인했습니다.
            </span>
          </label>

          <div id="google-login-slot" class="google-login-slot"></div>
          <div id="auth-dev-actions" class="auth-dev-actions">
            <button id="google-demo-login-btn" class="google-fallback-btn" type="button">개발용 유저 로그인</button>
            <button id="google-demo-operator-login-btn" class="google-fallback-btn" type="button">개발용 운영자 로그인</button>
          </div>
          <div id="auth-session-actions" class="auth-session-actions hidden">
            <a class="primary-link-button" href="./account.html">내 정보 보기</a>
            <button id="auth-logout-btn" class="secondary-link-button" type="button">로그아웃</button>
          </div>
          <p id="auth-status" class="auth-status" data-tone="muted">Google 로그인 준비 중입니다.</p>
        </article>

        <aside class="login-panel-right">
          <div>
            <h2>아직 회원이 아니신가요?</h2>
            <p><strong>기부는 간단하게,</strong><br />증빙은 검증 가능하게.</p>
            <p>Google 계정 하나로 가장 단순한 기부 경험을 시작하세요.</p>
          </div>
          <span class="login-benefit-badge">Google 가입 시 바로 이용 가능</span>
          <a class="login-outline-action" href="#google-login-slot">Google 계정으로 시작하기</a>
          <a class="login-text-link" href="./password-help.html">비밀번호 찾기/수정 안내</a>
        </aside>
      </section>
    </main>

  </body>
</html>
